syntax = "proto3";
package clipx;

enum PeerCapabilities {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_COMPRESSION = 1; // later
  CAPABILITY_TLS = 2; // later
  CAPABILITY_WIFI_DIRECT = 3;
  // Supports file transfer stalling re-requests
  CAPABILITY_FILE_TRANSFER_STALLING_RE_REQUESTS = 4; 
  // The peer understands FileTransferCancel.pause and FileTransferResume, so a transfer can be
  // paused and resumed. Peers without it still transfer and can still cancel; pause/resume
  // toward them is disabled instead of refusing the connection.
  CAPABILITY_FILE_TRANSFER_CONTROL = 5;
}
message Hello { 
  uint32 proto_version = 1; // What currently I speak
  uint32 min_proto_version = 2; // old peer I accept (0 = old builds, unknown)
  // this answers which capabilities the peer offers — something a device/peer is capable of doing or support
  // can resume downloads, supports wifi-direct, accept images etc.
  repeated PeerCapabilities capabilities = 3; 
}

// Clipboard payloads intentionally separate ordinary clipboard content from
// file offers. Text/rich-text/images can be delivered immediately. Files are
// represented by a short-lived offer and fetched only after the receiver asks.
message ClipboardMessage {
    oneof content {
        string text = 1;
        RichText rich_text = 2;
        ImageContent image = 3;
        FileOffer file_offer = 4;
    }
}
message RichText { string text = 1; string html = 2; }
message ImageContent {
    uint32 width = 1;
    uint32 height = 2;
    bytes rgba = 3;
}
message FileOffer {
    string file_id = 1;
    string name = 2;
    string mime_type = 3;
    uint64 size = 4;
    uint64 expires_at_ms = 5;
}
message FileDownloadRequest { string file_id = 1; uint64 offset = 2; }
message FileChunk {
    string file_id = 1;
    uint64 seq = 2;
    bytes data = 3;
    bool eof = 4;
    uint64 total_size = 5;
    uint64 offset = 6;
    bytes sha256 = 7;
}
message FileChunkAck { string file_id = 1; uint64 confirmed_offset = 2; }
// Sent to the other side of a transfer. `pause = false` means the transfer is
// abandoned and the receiver discards its partial data; `pause = true` means the
// sender should stop streaming while the receiver keeps its partial data so a
// later request can continue from the confirmed offset. Peers that predate the
// field read it as false, which is the old cancel behavior.
message FileTransferCancel { string file_id = 1; bool pause = 2; }
// Sent by the sending side to a receiver that paused or was paused: "carry on". The receiver
// asks again from its kept offset. Only sent to peers that advertise CAPABILITY_FILE_TRANSFER_CONTROL.
message FileTransferResume { string file_id = 1; }

enum DeviceType {
  UNSPECIFIED = 0;
  WINDOWS = 1;
  ANDROID = 2;
  LINUX = 3;
  MACOS = 4;
  IOS = 5;
}

message Announce {
  bytes fingerprint = 1;
  string device_name = 2;
  DeviceType device_type = 3;
  uint32 ws_port = 4;
  Hello hello = 5;
}
message PeerPairRequest { string name = 1; bytes public_key = 2; bytes fingerprint = 3; Hello hello = 4; }
message PeerPairResponse { bytes public_key = 1; string name = 2; Hello hello = 3; }
message PeerPairChallenge { bytes nonce = 1; }
message PeerPairChallengeResponse { bytes signature = 1; }
message PairAck {}
message PeerConnectChallenge { bytes nonce = 1; bytes initiator_fingerprint = 2; Hello hello = 3; }
message PeerConnectChallengeResponse { bytes signature = 1; Hello hello = 2; }
message ConnectAck {}
message PreTransportControl { uint32 code = 1; string message = 2; }
message PeerMessage {
  oneof body {
    PeerPairRequest pair_request = 1;
    PeerPairResponse pair_response = 2;
    PeerPairChallenge pair_challenge = 3;
    PeerPairChallengeResponse pair_challenge_response = 4;
    PairAck pair_ack = 5;
    PeerConnectChallenge connect_challenge = 6;
    PeerConnectChallengeResponse connect_challenge_response = 7;
    ConnectAck connect_ack = 8;
    PreTransportControl control = 9;
    ClipboardMessage clipboard = 10;
    FileDownloadRequest file_download_request = 11;
    FileChunk file_chunk = 12;
    FileChunkAck file_chunk_ack = 13;
    FileTransferCancel file_transfer_cancel = 14;
    FileTransferResume file_transfer_resume = 15;
  }
}

message IpcRequest {
  oneof request {
    SeenRequest seen = 1;
    TrustedRequest trusted = 2;
    IdentityRequest identity = 3;
    PairRequest pair = 4;
    PairPendingRequest pair_pending = 5;
    PairApproveRequest pair_approve = 6;
    ConnectRequest connect = 7;
    ConnectedRequest connected = 8;
    GetPairedRequest get_paired = 9;
    DisconnectRequest disconnect = 10;
    SetAutoConnectRequest set_auto_connect = 11;
    ForgetDeviceRequest forget_device = 12;
    ClipboardHistoryRequest clipboard_history = 13;
    ClipboardRemoveRequest clipboard_remove = 14;
    ClipboardClearRequest clipboard_clear = 15;
    SendTextRequest send_text = 16;
    SendRichTextRequest send_rich_text = 17;
    SendImageRequest send_image = 18;
    SendFileRequest send_file = 19;
    DownloadClipboardFileRequest download_clipboard_file = 20;
    SendFilePathRequest send_file_path = 21;
    ShutdownRequest shutdown = 22;
    ClipboardCopyRequest copy_clipboard_entry = 23;
    AttachNotificationCenterRequest attach_notification_center = 24;
    ResolvePromptRequest resolve_prompt = 25;
    ControlTransferRequest control_transfer = 26;
    ListTransfersRequest list_transfers = 27;
  }
}
message IpcResponse {
  oneof response {
    SeenResponse seen = 1;
    TrustedResponse trusted = 2;
    IdentityResponse identity = 3;
    PairResponse pair = 4;
    PairPendingResponse pair_pending = 5;
    PairApproveResponse pair_approve = 6;
    ConnectResponse connect = 7;
    ConnectedResponse connected = 8;
    ErrorResponse error = 9;
    GetPairedResponse get_paired = 10;
    DisconnectResponse disconnect = 11;
    SetAutoConnectResponse set_auto_connect = 12;
    ForgetDeviceResponse forget_device = 13;
    ClipboardHistoryResponse clipboard_history = 14;
    ClipboardRemoveResponse clipboard_remove = 15;
    ClipboardClearResponse clipboard_clear = 16;
    SendResponse send = 17;
    DownloadClipboardFileResponse download_clipboard_file = 18;
    ShutdownResponse shutdown = 19;
    ClipboardCopyResponse copy_clipboard_entry = 20;
    AttachNotificationCenterResponse attach_notification_center = 21;
    ResolvePromptResponse resolve_prompt = 22;
    ControlTransferResponse control_transfer = 23;
    ListTransfersResponse list_transfers = 24;
  }
}
message SeenRequest { enum Mode { ALL = 0; TRUSTED = 1; UNTRUSTED = 2; } Mode mode = 1; }
message SeenResponse { repeated DeviceInfo devices = 1; }
message TrustedRequest {}
message TrustedResponse { repeated DeviceInfo devices = 1; }
message IdentityRequest {}
message IdentityResponse { string device_id = 1; string device_name = 2; string public_key_hex = 3; uint32 ws_port = 4; DeviceType device_type = 5; string ip_address = 6; }
message ErrorResponse { string message = 1; }
message PairRequest { string device_id = 1; }
message PairResponse { string device_id = 1; string status = 2; string message = 3; string pairing_code = 4; }
message PairPendingRequest {}
message PairPendingResponse { repeated PairPendingSession pending = 1; }
message PairPendingSession { string device_id = 1; string device_name = 2; string stage = 3; string code = 4; }
message PairApproveRequest { string device_id = 1; bool approve = 2; }
message PairApproveResponse { string device_id = 1; string status = 2; string message = 3; }
message ConnectRequest { string device_id = 1; }
message ConnectResponse { string device_id = 1; string status = 2; string message = 3; }
message ConnectedRequest {}
message ConnectedResponse { repeated DeviceInfo devices = 1; }
enum ConnectionState { DISCONNECTED = 0; CONNECTING = 1; CONNECTED = 2; UNAVAILABLE = 3; }
message DeviceInfo { string id = 1; string name = 2; DeviceType device_type = 3; string address = 4; uint64 last_seen_ms = 5; uint32 ws_port = 6; ConnectionState connection = 7; bool auto_connect = 8; bool trusted = 9; }
message GetPairedRequest {}
message GetPairedResponse { repeated DeviceInfo devices = 1; }
message DisconnectRequest { string device_id = 1; }
message DisconnectResponse { string device_id = 1; string status = 2; string message = 3; }
message SetAutoConnectRequest { string device_id = 1; bool auto_connect = 2; }
message SetAutoConnectResponse { string device_id = 1; bool auto_connect = 2; }
message ForgetDeviceRequest { string device_id = 1; }
message ForgetDeviceResponse { string device_id = 1; string status = 2; }

message ClipHistoryEntry {
  string id = 1;
  string content = 2;
  string source_device_name = 3;
  uint64 received_at_ms = 4;
  string kind = 5;
  string html = 6;
  string file_id = 7;
  string file_name = 8;
  string mime_type = 9;
  uint64 file_size = 10;
  uint64 file_expires_at_ms = 11;
  bool file_downloaded = 12;
  string local_file_path = 13;
}
message ClipboardHistoryRequest { uint32 limit = 1; }
message ClipboardHistoryResponse { repeated ClipHistoryEntry entries = 1; }
message ClipboardRemoveRequest { string id = 1; }
message ClipboardRemoveResponse { bool removed = 1; }
message ClipboardClearRequest {}
message ClipboardClearResponse {}
message SendTextRequest { string content = 1; }
message SendRichTextRequest { string text = 1; string html = 2; }
message SendImageRequest { uint32 width = 1; uint32 height = 2; bytes rgba = 3; }
message SendFileRequest { string name = 1; string mime_type = 2; bytes data = 3; }
message SendFilePathRequest { string name = 1; string mime_type = 2; string path = 3; }
message SendResponse { bool sent = 1; string message = 2; }
message DownloadClipboardFileRequest { string entry_id = 1; }
message DownloadClipboardFileResponse { bool started = 1; string message = 2; }
message ClipboardCopyRequest { string id = 1; }
message ClipboardCopyResponse { bool copied = 1; string message = 2; }

message DevicesChangedEvent {}
message ClipboardChangedEvent {}
message PairingEvent { string device_id = 1; enum State { STARTED = 0; FAILED = 1; SUCCEEDED = 2; } State state = 2; string message = 3; }
message FileTransferEvent { string entry_id = 1; uint64 done = 2; uint64 total = 3; string state = 4; string message = 5; string file_id = 6; string file_name = 7; string direction = 8; string device_id = 9; string device_name = 10; bool can_pause = 11; }
message IpcEvent { oneof event { DevicesChangedEvent devices_changed = 1; ClipboardChangedEvent clipboard_changed = 2; PairingEvent pairing_event = 3; FileTransferEvent file_transfer = 4; NotificationPromptEvent notification_prompt = 5; NotificationClosedEvent notification_closed = 6; NotificationInfoEvent notification_info = 7; } }

// ---- Notification center -------------------------------------------------
// A UI that wants to show prompts (pairing, code confirmation, incoming files)
// itself, instead of the OS notification system, sends AttachNotificationCenter
// on its IPC connection. Until it does it receives none of the events below, so
// a UI that does not know about them keeps working and the core keeps using its
// native notifications. While at least one connection is attached the core
// sends prompts only here; when the last one detaches or disconnects it goes
// back to the native engine.
message AttachNotificationCenterRequest {}
// Prompts still waiting for an answer are pushed right after this response, so
// a UI that attaches late (or reconnects) misses nothing.
message AttachNotificationCenterResponse { uint32 pending = 1; }

message NotificationPromptEvent {
  enum Kind { PAIR_REQUEST = 0; CONFIRM_CODE = 1; INCOMING_CLIPBOARD = 2; }
  enum ContentKind { TEXT = 0; RICH_TEXT = 1; IMAGE = 2; FILE = 3; }
  string prompt_id = 1;
  Kind kind = 2;
  string peer_name = 3;
  // Pairing code to compare, for CONFIRM_CODE.
  string code = 4;
  // A short preview of what arrived, for INCOMING_CLIPBOARD (cut to a few thousand characters).
  string content = 5;
  ContentKind content_kind = 6;
  // How long the core waits for an answer before treating the prompt as ignored.
  uint32 timeout_ms = 7;
  uint64 shown_at_ms = 8;
}
message NotificationClosedEvent {
  enum Reason { ANSWERED = 0; TIMED_OUT = 1; }
  string prompt_id = 1;
  Reason reason = 2;
}
// A plain message with nothing to answer ("Image saved", "File expired", ...).
message NotificationInfoEvent { string id = 1; string title = 2; string body = 3; uint64 at_ms = 4; }

message ResolvePromptRequest {
  // ALLOW / DENY answer a pairing or code prompt; COPY / IGNORE answer an
  // incoming-clipboard prompt (COPY also means "download" for a file).
  enum Decision { ALLOW = 0; DENY = 1; COPY = 2; IGNORE = 3; }
  string prompt_id = 1;
  Decision decision = 2;
}
message ResolvePromptResponse { bool resolved = 1; string message = 2; }

// Pause, resume or cancel one transfer. device_id narrows it to one device when
// the same offer goes to several (empty means any).
message ControlTransferRequest {
  enum Action { PAUSE = 0; RESUME = 1; CANCEL = 2; }
  string file_id = 1;
  string device_id = 2;
  Action action = 3;
}
// ok = false carries the reason in message (for example a peer on an older
// build that cannot pause).
message ControlTransferResponse { bool ok = 1; string message = 2; }

message ListTransfersRequest {}
message TransferInfo {
  string device_id = 1;
  string device_name = 2;
  string entry_id = 3;
  string file_id = 4;
  string file_name = 5;
  string direction = 6;
  uint64 done = 7;
  uint64 total = 8;
  string state = 9;
  bool can_pause = 10;
}
message ListTransfersResponse { repeated TransferInfo transfers = 1; }
message IpcServerMessage { oneof payload { IpcResponse response = 1; IpcEvent event = 2; } }

message ShutdownRequest {}
message ShutdownResponse {}