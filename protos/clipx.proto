syntax = "proto3";
package clipx;


// ---------------------------------
// Clipboard types
// ---------------------------------
message Hello {
    uint32 proto_version = 1;
}

message ClipboardMessage {
    oneof content {
        string text = 1;
    }
}

// -----------------------------------------
// Device Discovery types
// ----------------------------------------
message Announce {
  bytes fingerprint = 1;
  string device_name = 2;
  DeviceType device_type = 3;
  uint32 ws_port = 4;
}

enum DeviceType {
  UNSPECIFIED = 0;
  WINDOWS = 1;
  ANDROID = 2;
  LINUX = 3;
  MACOS = 4;
  IOS = 5;
}

// -----------------------------
// Device pairing and Connection
// -----------------------------
message PeerPairRequest {
  string name = 1;
  bytes public_key = 2;
  bytes fingerprint = 3; // lets an inbound responder key its connection without recomputing
}

message PeerPairResponse {
  bytes public_key = 1;
  string name = 2;
}

message PeerPairChallenge {
  bytes nonce = 1;
}

message PeerPairChallengeResponse {
  bytes signature = 1;
}

message PairAck {}

// ---- Connect: 3-way, already-trusted devices only ----
message PeerConnectChallenge {
  bytes nonce = 1;
  bytes initiator_fingerprint = 2; // lets an inbound responder look up who's calling
}

message PeerConnectChallengeResponse {
  bytes signature = 1;
}

message ConnectAck {}

// ---- Shared pre-transport control (4xxx fixed codes — see pairing::control) ----
message PreTransportControl {
  uint32 code = 1;
  string message = 2;
}

// Single wire envelope for the peer TCP+WS transport. Pre-transport variants
// are handled today; Clipboard is defined but not yet routed anywhere.
message PeerMessage {
  oneof body {
    PeerPairRequest pair_request = 1;
    PeerPairResponse pair_response = 2;
    PeerPairChallenge pair_challenge = 3;
    PeerPairChallengeResponse pair_challenge_response = 4;
    PairAck pair_ack = 5;
    PeerConnectChallenge connect_challenge = 6;
    PeerConnectChallengeResponse connect_challenge_response = 7;
    ConnectAck connect_ack = 8;
    PreTransportControl control = 9;
    ClipboardMessage clipboard = 10;
  }
}

// --------------------------------------------------------------
// IPC based types - will split them later into different package
// --------------------------------------------------------------
message IpcRequest {
  oneof request {
    SeenRequest seen = 1;
    TrustedRequest trusted = 2;
    IdentityRequest identity = 3;
    PairRequest pair = 4;
    PairPendingRequest pair_pending = 5;
    PairApproveRequest pair_approve = 6;
    ConnectRequest connect = 7;
    ConnectedRequest connected = 8;
    GetPairedRequest get_paired = 9;
    DisconnectRequest disconnect = 10;
    SetAutoConnectRequest set_auto_connect = 11;
    ForgetDeviceRequest forget_device = 12;
  }
}

message IpcResponse {
  oneof response {
    SeenResponse seen = 1;
    TrustedResponse trusted = 2;
    IdentityResponse identity = 3;
    PairResponse pair = 4;
    PairPendingResponse pair_pending = 5;
    PairApproveResponse pair_approve = 6;
    ConnectResponse connect = 7;
    ConnectedResponse connected = 8;
    ErrorResponse error = 9;
    GetPairedResponse get_paired = 10;
    DisconnectResponse disconnect = 11;
    SetAutoConnectResponse set_auto_connect = 12;
    ForgetDeviceResponse forget_device = 13;
  }
}

message SeenRequest {
  enum Mode {
    ALL = 0;
    TRUSTED = 1;
    UNTRUSTED = 2;
  }

  Mode mode = 1;
}

message SeenResponse {
  repeated DeviceInfo devices = 1;
}

message TrustedRequest {}

message TrustedResponse {
  repeated DeviceInfo devices = 1;
}

message IdentityRequest {}

message IdentityResponse {
  string device_id = 1;
  string device_name = 2;
  string public_key_hex = 3;
  uint32 ws_port = 4;
  DeviceType device_type = 5;
  string ip_address = 6;
}

message ErrorResponse {
  string message = 1;
}

message PairRequest {
  string device_id = 1;
}

message PairResponse {
  string device_id = 1;
  string status = 2;
  string message = 3;
  string pairing_code = 4;
}

message PairPendingRequest {}
message PairPendingResponse {
  repeated PairPendingSession pending = 1;
}
message PairPendingSession {
  string device_id = 1;
  string device_name = 2;
  string stage = 3; // "awaiting_approval" | "awaiting_code_confirm"
  string code = 4;  // set only when stage == awaiting_code_confirm
}

message PairApproveRequest {
  string device_id = 1;
  bool approve = 2;
}
message PairApproveResponse {
  string device_id = 1;
  string status = 2;
  string message = 3;
}

message ConnectRequest {
  string device_id = 1;
}

message ConnectResponse {
  string device_id = 1;
  string status = 2;
  string message = 3;
}

message ConnectedRequest {}

message ConnectedResponse {
  repeated DeviceInfo devices = 1;
}

enum ConnectionState {
  DISCONNECTED = 0;
  CONNECTING = 1;
  CONNECTED = 2;
  UNAVAILABLE = 3;
}

message DeviceInfo {
  string id = 1;
  string name = 2;
  DeviceType device_type = 3;
  string address = 4;
  uint64 last_seen_ms = 5;
  uint32 ws_port = 6;
  ConnectionState connection = 7;
  bool auto_connect = 8;
  bool trusted = 9;
}

message GetPairedRequest {}
message GetPairedResponse {
  repeated DeviceInfo devices = 1;
}

message DisconnectRequest { string device_id = 1; }
message DisconnectResponse {
  string device_id = 1;
  string status = 2;
  string message = 3;
}

message SetAutoConnectRequest {
  string device_id = 1;
  bool auto_connect = 2;
}
message SetAutoConnectResponse {
  string device_id = 1;
  bool auto_connect = 2;
}

message ForgetDeviceRequest { string device_id = 1; }
message ForgetDeviceResponse {
  string device_id = 1;
  string status = 2;
}