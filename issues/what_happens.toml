# Source of truth for issues/what_happens.md  (do not hand-edit the .md)
#
# Edit this file, or use:   python issues/issues.py wh add            (opens your editor)
#                           python issues/issues.py wh add "question?" --area connect
# Then:                     python issues/issues.py wh render           (add/set already do this)
#
# id      WH-NNN, incremental, never reused
# area    pairing | connect | transfer | clipboard | discovery | protocol | ui | platform
# status  untested -> nobody has tried it
#         tested   -> tried, behaved as expected
#         issue    -> tried, something unexpected happened; `issues` must list the issue number(s)
# issues  issue numbers from issues/issue.md that this scenario relates to (optional unless status = issue)
# note    how to reproduce / hints (optional). Questions only, no answers.

[[scenario]]
id = "WH-001"
area = "connect"
status = "untested"
issues = ["0001"]
question = "When device A and device B try to connect to each other at the same moment, what happens?"
note = "Both dial; arbitration decides whose challenge wins (control code 4008 CONNECT_IN_PROGRESS)."

[[scenario]]
id = "WH-002"
area = "pairing"
status = "untested"
issues = ["0004"]
question = "When A forgets B while B is offline and A later pairs with B again, what happens on each device?"
note = "B still holds the old trust record. Compare with B initiating the connection instead."

