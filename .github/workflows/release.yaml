name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # builds everything, no release (CI dry run)

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"
      - run: node scripts/sync-version.mjs --check

  desktop:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/clipx-app
    env:
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/clipx-app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/clipx-app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri icon ../../assets/clipx-brand-mark-squircle.svg
      - run: pnpm release

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/rpm/*.rpm
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/dmg/*.dmg

  android:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/native
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PclipxAbis=arm64-v8a

      - name: Package APK (signed if keystore secrets exist)
        working-directory: mobile/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          V=$(tr -d '[:space:]' < ../../VERSION)
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p dist
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -f -p 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
              --out "dist/clipx-$V-android-arm64.apk" "$RUNNER_TEMP/aligned.apk"
          else
            cp "$SRC" "dist/clipx-$V-android-arm64-unsigned.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: mobile/android/dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          find artifacts -type f -exec cp -t release {} +
          (cd release && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Clipx $GITHUB_REF_NAME" \
            --generate-notes