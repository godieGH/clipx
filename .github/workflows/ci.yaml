name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-version.mjs --check

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/clipx-app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/clipx-app/pnpm-lock.yaml

      - name: Frontend
        working-directory: desktop/clipx-app
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri icon ../../assets/clipx-brand-mark-squircle.svg
          pnpm build

      - name: Rust
        working-directory: desktop
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

  ffi:
    name: ffi (mobile/native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/native
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Rust (host)
        working-directory: mobile/native
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      # Catches android-only breakage (cfg(target_os = "android") code,
      # paranoid-android, linking) without needing Gradle.
      - name: Cross-compile for Android
        working-directory: mobile/native
        run: cargo ndk -t arm64-v8a build --package rust-mobile-ffi-bridge --release

      # Catches UniFFI interface breakage before Kotlin ever sees it.
      - name: Generate Kotlin bindings
        working-directory: mobile/native
        run: |
          cargo run --bin uniffi-bindgen generate \
            --library target/aarch64-linux-android/release/librust_mobile_ffi_bridge.so \
            --language kotlin --out-dir "$RUNNER_TEMP/bindings"

  android:
    name: android (app)
    needs: ffi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/native
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + debug build
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug -PclipxAbis=arm64-v8a

  emulator:
    name: emulator tool builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/emulator
      - run: cargo clippy --manifest-path tests/emulator/Cargo.toml --all-targets -- -D warnings
