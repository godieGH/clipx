[package]
name = "rust-mobile-ffi-bridge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
uniffi = { version = "0.29.5", features = ["cli", "tokio"] }
thiserror = "2"

# load clipx-core lib so ffi can reuse the core functionality and expose uniffied APIs
clipx-core = {workspace = true}

# loggers
log = "0.4.34"
tracing = "0.1.44"
tracing-subscriber = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2"
