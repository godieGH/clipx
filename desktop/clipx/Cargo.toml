[package]
name = "clipx"
version.workspace = true
edition = "2021"


[lib]
name = "clipx_lib"

[dependencies]
interprocess = { version = "2.4.2", features = ["tokio"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3.31"
prost = "0.14.4"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
tokio-tungstenite = "0.29.0"
tungstenite = "0.24"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"

[build-dependencies]
prost-build = "0.14.4"
