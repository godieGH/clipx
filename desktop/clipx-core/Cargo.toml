[package]
name = "clipx-core"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
futures-util = "0.3.31"
hostname = "0.4.2"
prost = "0.14.4"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.11.0"
hex = { version = "0.4.3", features = ["serde"] }
anyhow = "1.0.104"
tokio-util = { version = "0.7.19", features = ["full"] }
humantime-serde = "1.1.1"
if-addrs = "0.15.0"
socket2 = { version = "0.5", features = ["all"] }
interprocess = { version = "2.4.2", features = ["tokio"] }


[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
arboard = "3.6.1"


[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
# Used directly (alongside tauri-winrt-notification) only for the file
# transfer progress toast: tauri-winrt-notification's own
# Toast::set_progress() hardcodes the WinRT update sequence number to a
# fixed non-zero value on every call, so after the very first progress
# update the shell sees the same sequence number again, treats it as
# already-applied, and silently drops it — the progress bar freezes. A
# sequence number of 0 tells the shell "always apply this", so we call
# NotificationData/ToastNotificationManager ourselves for progress updates.
# Feature list and version pinned to match tauri-winrt-notification 0.8.1's
# own `windows` dependency.
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation_Collections",
    "UI_Notifications",
    "Win32_System_Com",
] }

[build-dependencies]
prost-build = "0.14.4"
