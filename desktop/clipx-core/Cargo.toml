[package]
name = "clipx-core"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
directories = "6.0.0"
futures-util = "0.3.31"
hostname = "0.4.2"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v4"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
tauri-winrt-notification = "0.8.1"
sha2 = "0.11.0"
hex = "0.4.3"
interprocess = { version = "2.4.2", features = ["tokio"] }
anyhow = "1.0.104"
tokio-util = { version = "0.7.19", features = ["full"] }

[build-dependencies]
prost-build = "0.14.4"
